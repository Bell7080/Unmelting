name: Verify and Deploy

# 검증(verify)과 배포(deploy)를 분리한다.
# 기능 브랜치는 verify까지만 돌고, 배포는 main에서만 실행한다 —
# Pages 환경 보호 규칙이 main만 게시를 허용하므로 그 외 브랜치는 거부 오류가 난다.

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 그룹은 반드시 ref별로 나눈다. 예전처럼 전 브랜치가 'pages' 하나를 공유하면
# 기능 브랜치 푸시가 진행 중인 main 실행(배포 포함)을 취소해 버린다.
# 여기서 취소되는 건 "같은 브랜치의 낡은 실행"뿐이다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Resource lifecycle check
        run: npm run resources:check

      # verify 항목을 위에서 개별로 돌았으므로 여기서는 번들만 만든다.
      - name: Build
        run: npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 실제 Pages 배포만 전역 직렬화한다. cancel-in-progress를 끄는 게 핵심 —
    # 배포는 취소하지 않고 줄을 세워야 마지막 커밋이 확실히 게시된다.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
