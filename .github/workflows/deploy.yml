name: Verify and Deploy

# 두 갈래로 나눠 둔다.
#
#   main  — 프로덕션. 여기 올라온 것만 GitHub Pages로 배포된다.
#   test  — 개발. Vercel이 이 브랜치를 받아 빠르게 빌드하고 플레이 가능한 URL을 준다.
#           Actions는 여기서 배포하지 않고 "깨졌는지"만 본다.
#
# 그래서 아티팩트(Pages 번들)는 **배포할 수 있는 실행에서만** 만든다. 기능 브랜치까지
# 번들을 만들어 올리면 배포도 안 할 것을 매번 굽느라 브랜치 CI가 느려진다.

on:
  push:
    branches:
      - main
      - test
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 그룹은 반드시 ref별로 나눈다. 예전처럼 전 브랜치가 'pages' 하나를 공유하면
# 기능 브랜치 푸시가 진행 중인 main 실행(배포 포함)을 취소해 버린다.
# 여기서 취소되는 건 "같은 브랜치의 낡은 실행"뿐이다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Resource lifecycle check
        run: npm run resources:check

      # verify 항목을 위에서 개별로 돌았으므로 여기서는 번들만 만든다.
      # 배포하는 브랜치에서만 굽는다 — 나머지 브랜치의 빌드 검증은 Vercel이 대신한다.
      - name: Build
        if: github.ref == 'refs/heads/main'
        run: npx vite build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 실제 Pages 배포만 전역 직렬화한다. cancel-in-progress를 끄는 게 핵심 —
    # 배포는 취소하지 않고 줄을 세워야 마지막 커밋이 확실히 게시된다.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
